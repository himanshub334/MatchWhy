services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: matchwhy
      POSTGRES_USER: matchwhy
      POSTGRES_PASSWORD: matchwhy
    ports: ["5433:5432"]
    volumes: [matchwhy_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchwhy -d matchwhy"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://matchwhy:matchwhy@db:5432/matchwhy
      JOBSENSE_API_URL: http://host.docker.internal:8000
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8001:8001"]
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8001"
  frontend:
    build: ./frontend
    ports: ["5174:5174"]
    environment:
      VITE_API_URL: http://localhost:8001
    depends_on: [api]
volumes:
  matchwhy_data:
